# Conservative Superstock Investor Profile
# Lower risk tolerance, balanced approach between technicals and fundamentals

name: Conservative
description: Balanced approach seeking quality setups with fundamental backing. Requires strong earnings, low debt, and multiple confirming signals.

# Minimum score to include in results
min_score: 70

# Minimum criteria that must be met
min_criteria_met: 12

# Criteria weight adjustments (multipliers on base weights)
weight_adjustments:
  magic_line: 1.0        # Standard weight
  volume_surge: 0.9      # Don't chase breakouts
  volume_dryup: 1.1      # Value accumulation
  float_shares: 0.8      # Less focus on float
  insider_buying: 1.4    # Strong emphasis on insiders
  relative_strength: 0.9 # Less momentum focus
  near_52w_high: 0.8     # Prefer value plays
  price_range: 1.0       # Standard price range
  peg_ratio: 1.3         # Value conscious
  earnings_growth: 1.4   # Fundamental focus
  revenue_growth: 1.3    # Revenue matters
  debt_equity: 1.5       # Strong balance sheet required
  current_ratio: 1.3     # Cash position important

# Filter adjustments for pre-screening
filters:
  max_price: 50          # Lower price stocks
  min_volume: 200000     # Need liquidity
  max_market_cap: 10000  # Focus on small cap (millions)
  min_market_cap: 100    # Avoid micro caps

# Entry signal preferences
preferred_signals:
  - magic_line_touch     # Wait for dip
  - pullback_entry       # Buy weakness
  # Avoid: breakout_volume (don't chase)

# Risk parameters
risk:
  max_positions: 10
  max_position_size_pct: 5
  stop_loss_pct: 8       # Tighter stops
  chase_tolerance_pct: 10 # Won't buy far above ML

# Market condition overrides
market_conditions:
  ignore_vix_warning: false  # Respect volatility
  min_spy_trend: bullish     # Only trade in uptrend
